# What the auth server needs to run on a laptop: a Postgres, and a stand-in for Azure API Management.
# Nothing here talks to Microsoft. Ports are 5435 and 8098 so they do not clash with a Postgres you already run.
name: amp-auth-demo

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amp_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5435:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amp_auth"]
      interval: 2s
      timeout: 3s
      retries: 30

  apim-stand-in:
    image: wiremock/wiremock:3.9.1
    command: ["--global-response-templating", "--verbose"]
    volumes: ["./wiremock:/home/wiremock:ro"]
    ports: ["8098:8080"]
