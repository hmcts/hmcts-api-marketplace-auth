nodejs:
  applicationPort: 3001
  aadIdentityName: amp
  ingressHost: amp-auth.{{ .Values.global.environment }}.platform.hmcts.net
  image: 'hmctsprod.azurecr.io/amp/auth:latest'

  environment:
    NODE_ENV: production
    FRONTEND_ORIGIN: https://hmcts.github.io

  # Uncomment once infrastructure/ has applied (provisioning the amp-{env}
  # Key Vault) and README.md's "Infrastructure (AKS / CNP)" steps have
  # populated these secrets - Key Vault secret names are hyphenated, not
  # underscored (Azure doesn't allow underscores in secret names).
  #  keyVaults:
  #    amp:
  #      secrets:
  #        - JWT-SECRET
  #        - DATABASE-URL
  #        - ENTRA-TENANT-ID
  #        - ENTRA-CLIENT-ID
  #        - ENTRA-CLIENT-SECRET

  # /health does not exist in src/server.js yet - every current route needs a
  # signed-in token (401) or a body (400), neither of which a health check can
  # supply. Needs adding: an unauthenticated GET returning 200.
  readinessPath: /health
  livenessPath: /health
