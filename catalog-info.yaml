# Backstage catalog-info.yaml. See https://github.com/hmcts/backstage-hmcts-examples
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: "amp-auth"
  description: "Authentication and application-registration backend for the HMCTS API Marketplace"
  annotations:
    # This should match folder-name/job-name in Jenkins.
    jenkins.io/job-full-name: cft:HMCTS_amp/hmcts-api-marketplace-auth
    # TODO: this repo currently lives at github.com/ZaheerIqbal-HMCTS/hmcts-api-marketplace-auth,
    # a personal account. CNP repo conventions (team-based access, Jenkins org
    # scan, cnp-jenkins-config allowlisting) all assume a repo under the hmcts
    # GitHub org - update this once the repo has moved there.
    github.com/project-slug: 'hmcts/hmcts-api-marketplace-auth'
  tags:
    - nodejs
spec:
  type: service
  system: amp
  lifecycle: experimental
  owner: amp
